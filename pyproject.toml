[project]
name = "ppg-fm"
version = "0.1.0"
description = "PPG foundation model research - morphology-centric biomarker discovery"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
    "wfdb",
    "vitaldb",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
morph = ["pyPPG", "neurokit2", "dotmap", "mne"]   # 참조 구현 비교용 (Python 3.10+ 필요)
dev = ["jupyter", "ipykernel", "seaborn"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
